apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  namespace: my-namespace
spec:
  replicas: 5
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: my-app-container
          image: ranjeet301095/multibranch-flask-app:build-3
          ports:
            - containerPort: 5000